<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ block "title" . }}MySQL Formatter{{ end }}</title>
    <meta name="description" content="Format MySQL queries with syntax highlighting. Outputs for SQL, PHP, and Go.">

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#282a36">
    <meta name="theme-color" content="#282a36">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- WASM Module -->
    <script src="/wasm/mysql_format.js"></script>

    <!-- Monaco Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.0/min/vs/loader.min.js"></script>

    <!-- Compiled SCSS -->
    {{ $sass := resources.Get "sass/main.scss" | toCSS (dict "transpiler" "dartsass") | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $sass.Permalink }}" integrity="{{ $sass.Data.Integrity }}">
</head>
<body>
    <!-- Header -->
    <nav class="navbar">
        <div class="container-fluid">
            <span class="navbar-brand">
                <i class="bi bi-database"></i> MySQL Formatter
            </span>
            <a href="https://github.com/StirlingMarketingGroup/mysql-format" class="github-link" target="_blank" rel="noopener">
                <i class="bi bi-github"></i> GitHub
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="main">
        {{ block "main" . }}{{ end }}
    </main>

    <!-- Footer -->
    <footer>
        &copy; <span id="year"></span> Stirling Marketing Group
    </footer>

    <!-- Application JS -->
    {{ $js := resources.Get "js/app.js" | minify | fingerprint }}
    <script src="{{ $js.Permalink }}" integrity="{{ $js.Data.Integrity }}"></script>

    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
