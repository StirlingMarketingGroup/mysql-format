name: github pages

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/assets/package-lock.json

      - name: install npm dependencies
        working-directory: website/assets
        run: npm ci

      - name: setup hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: install dart sass
        run: |
          curl -LO https://github.com/sass/dart-sass/releases/download/1.83.0/dart-sass-1.83.0-linux-x64.tar.gz
          tar -xzf dart-sass-1.83.0-linux-x64.tar.gz
          sudo mv dart-sass/sass /usr/local/bin/sass
          sudo mv dart-sass/src /usr/local/bin/src
          sass --version

      - name: build website
        working-directory: website
        run: hugo --minify

      - name: deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/public
