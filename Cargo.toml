[package]
name = "mysql-format"
version = "0.1.1"
authors = ["Brian Leishman <brian@stumpyinc.com>"]
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
phf = "0.13"
wasm-bindgen = "0.2"
